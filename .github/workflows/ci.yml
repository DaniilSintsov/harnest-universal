name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: make release
      - name: Verify stamped version
        run: test "$(./dist/harnest-linux-amd64 version)" = "harnest v$(make --no-print-directory version)"
